<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew Corner Cafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Brew Corner</h1>
    <p>Fresh coffee. Warm cakes. Good mornings.</p>
    <a href="#menu" class="btn">See Menu</a>
  </header>

  <section id="menu">
    <h2>Our Menu</h2>
    <div class="cards">
      <div class="card">
        <h3>Cappuccino</h3>
        <p>Rich espresso with creamy milk foam.</p>
      </div>
      <div class="card">
        <h3>Cold Coffee</h3>
        <p>Chilled, smooth, and refreshing.</p>
      </div>
      <div class="card">
        <h3>Choco Cake</h3>
        <p>Soft chocolate cake, baked fresh daily.</p>
      </div>
    </div>
  </section>

  <footer>
    <p>Brew Corner Cafe | Open 8 AM to 9 PM</p>
  </footer>

</body>
</html>
